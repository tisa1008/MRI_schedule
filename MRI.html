<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRI排班系統</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .toast-enter { animation: slideIn 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-emerald-50 text-emerald-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    const VERSION_PREFIX = 'v1.4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbw3iLwgIA8EwN9RqRCT12D1Q-YlqBnyOo0T6u9fLDBWa6b2iz03Fs3nmmGs0ifQKt0M/exec';
    const CLOUD_GROUP = 'MRI';
    const META_GROUP = 'MRI_META';
    const META_DATE = '1970-01-01';

    const Icon = ({ path, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        className={className}>
        {path}
      </svg>
    );

    const Icons = {
      RotateCcw: (props) => <Icon {...props} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>} />,
      Redo: (props) => <Icon {...props} path={<><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></>} />,
      FileSpreadsheet: (props) => <Icon {...props} path={<><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></>} />,
      Calendar: (props) => <Icon {...props} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />,
      ArrowLeftRight: (props) => <Icon {...props} path={<><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></>} />,
      AlertTriangle: (props) => <Icon {...props} path={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />,
      Download: (props) => <Icon {...props} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>} />,
      Upload: (props) => <Icon {...props} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>} />,
      Settings: (props) => <Icon {...props} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />,
      Clock: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
      CheckCircle: (props) => <Icon {...props} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
      XCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></>} />,
      Users: (props) => <Icon {...props} path={<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />,
      Filter: (props) => <Icon {...props} path={<><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></>} />,
      EyeOff: (props) => <Icon {...props} path={<><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C7 20 2.73 16.11 1 12c.9-2.16 2.32-4.06 4.14-5.57"/><path d="M9.9 4.24A10.93 10.93 0 0 1 12 4c5 0 9.27 3.89 11 8a11.05 11.05 0 0 1-4.08 5.58"/><line x1="1" y1="1" x2="23" y2="23"/></>} />,
      Minimize: (props) => <Icon {...props} path={<><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></>} />,
      Maximize: (props) => <Icon {...props} path={<><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></>} />
    };

    const initialStaffNames = [
      "吳雅芳", "林美花", "張賢慧", "吳佩芸", "楊志煒",
      "郭勝權", "范志龍", "林徑維", "潘洧樊", "許育誠", "陳長源", "鄭安傑"
    ];

    const DEFAULT_EXTRA_IDS = ['MR02', 'MR05', 'MR06', 'MR07', 'MR08'];

    const DAY_NAMES = ['日','一','二','三','四','五','六'];
    const MONDAY_FIRST_DAY_NAMES = ['一','二','三','四','五','六','日'];
    const DAY_MS = 24 * 60 * 60 * 1000;

    const OVERVIEW_COLOR = {
      blue: { bg: '#eff6ff', text: '#1e40af' },
      green: { bg: '#f0fdf4', text: '#166534' },
      purple: { bg: '#f5f3ff', text: '#5b21b6' },
      yellow: { bg: '#fefce8', text: '#854d0e' },
      teal: { bg: '#f0fdfa', text: '#115e59' },
      orange: { bg: '#fff7ed', text: '#9a3412' },
      cyan: { bg: '#ecfeff', text: '#155e75' },
      gray: { bg: '#f3f4f6', text: '#4b5563' },
      darkgray: { bg: '#e5e7eb', text: '#1f2937' },
      indigo: { bg: '#eef2ff', text: '#3730a3' },
      pink: { bg: '#fdf2f8', text: '#9d174d' }
    };

    const toDateKey = (dateObj) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const stripTime = (dateObj) => new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());

    const getWeekStartMonday = (dateObj) => {
      const d = stripTime(dateObj);
      const dow = d.getDay();
      const diff = (dow + 6) % 7;
      d.setDate(d.getDate() - diff);
      return d;
    };

    const normalizeStaffId = (raw) => {
      const v = String(raw || '').trim().toUpperCase();
      if (!v) return '';
      if (v === 'MRO') return 'O01';
      if (/^O\d+$/.test(v)) return `O${v.slice(1).padStart(2, '0')}`;

      let core = v.startsWith('MR') ? v.slice(2) : v;
      if (/^\d+$/.test(core)) core = core.padStart(2, '0');
      return `MR${core}`;
    };

    const formatStaffId = (id) => normalizeStaffId(id);

    const buildInitialStaff = () => {
      const base = initialStaffNames.map((name, i) => {
        const id = normalizeStaffId(String(i + 1));
        return {
          id,
          name,
          isSupport: false,
          preferExtra: DEFAULT_EXTRA_IDS.includes(id),
          allowG: true
        };
      });
      base.push({ id: 'O01', name: '蔡政宏', isSupport: true, preferExtra: false, allowG: false });
      return base;
    };

    const SHIFT_COLOR_OPTIONS = [
      { key: 'blue', className: 'bg-blue-100 text-blue-800', cellBg: 'bg-blue-50' },
      { key: 'green', className: 'bg-green-100 text-green-800', cellBg: 'bg-green-50' },
      { key: 'purple', className: 'bg-purple-100 text-purple-800', cellBg: 'bg-purple-50' },
      { key: 'yellow', className: 'bg-yellow-100 text-yellow-800', cellBg: 'bg-yellow-50' },
      { key: 'teal', className: 'bg-teal-100 text-teal-800', cellBg: 'bg-teal-50' },
      { key: 'orange', className: 'bg-orange-100 text-orange-800', cellBg: 'bg-orange-50' },
      { key: 'cyan', className: 'bg-cyan-100 text-cyan-800', cellBg: 'bg-cyan-50' },
      { key: 'gray', className: 'bg-gray-100 text-gray-600', cellBg: 'bg-gray-100' },
      { key: 'darkgray', className: 'bg-gray-300 text-gray-800 font-bold', cellBg: 'bg-gray-200' },
      { key: 'indigo', className: 'bg-indigo-100 text-indigo-800', cellBg: 'bg-indigo-50' },
      { key: 'pink', className: 'bg-pink-100 text-pink-800', cellBg: 'bg-pink-50' }
    ];

    const DEFAULT_SHIFT_LIST = [
      { code: 'B', label: '正常班 B', time: '08:00-17:00', overtime: 0, colorKey: 'blue', locked: true },
      { code: 'G', label: '正常班 G', time: '12:30-21:00', overtime: 0.5, colorKey: 'green', locked: true },
      { code: 'N', label: '正常班 N', time: '08:00-21:00', overtime: 4, colorKey: 'purple', locked: true },
      { code: 'D', label: '正常班 D', time: '08:00-16:30', overtime: 0, colorKey: 'yellow', locked: false },
      { code: 'A', label: '正常班 A', time: '-', overtime: 0.5, colorKey: 'teal', locked: false },
      { code: 'C', label: '正常班 C', time: '08:00-12:00', overtime: 4, colorKey: 'orange', locked: false },
      { code: '出車', label: '出車', time: '-', overtime: 0, colorKey: 'cyan', locked: false },
      { code: '國', label: '國定假日', time: '-', overtime: 0, colorKey: 'pink', locked: true },
      { code: 'OFF', label: '休假', time: '-', overtime: 0, colorKey: 'gray', locked: true },
      { code: 'OFF*', label: '必休 OFF*', time: '-', overtime: 0, colorKey: 'darkgray', locked: true }
    ];

    const CALL_TYPES = [
      { code: '21-24', label: '值 21-24' },
      { code: '00-04', label: '值 00-04' },
      { code: '04-07', label: '值 04-07' },
      { code: '00-07', label: '值 00-07' },
      { code: 'W1', label: '假日一線' },
      { code: 'W2', label: '假日二線' }
    ];
    const CALL_COUNT_KEYS = ['21-24', '00-04', '04-07', '00-07', 'W1', 'W2'];
    const PERSON_SHIFT_COUNT_KEYS = ['N', 'G', 'A', '國', 'OFF', 'OFF*'];

    const buildMonthlyTargets = (totalAssignments, autoStaffIds, priorityIds) => {
      if (autoStaffIds.length === 0) return {};
      const targets = {};
      const base = Math.floor(totalAssignments / autoStaffIds.length);
      let remainder = totalAssignments % autoStaffIds.length;
      autoStaffIds.forEach(id => targets[id] = base);

      const distOrder = [
        ...priorityIds.filter(id => autoStaffIds.includes(id)),
        ...autoStaffIds.filter(id => !priorityIds.includes(id))
      ];

      for (let i = 0; i < distOrder.length && remainder > 0; i++) {
        targets[distOrder[i]] += 1;
        remainder--;
      }
      return targets;
    };

    const normalizeImportedHolidays = (rawHolidays, importYear, importMonth) => {
      if (!Array.isArray(rawHolidays)) return [];
      const out = [];
      rawHolidays.forEach(item => {
        if (typeof item === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(item)) {
          out.push(item);
          return;
        }
        if (typeof item === 'number' && Number.isInteger(item)) {
          const dt = new Date(importYear, importMonth, item);
          if (dt.getMonth() === importMonth) out.push(toDateKey(dt));
        }
      });
      return Array.from(new Set(out));
    };

    const parseRevisionFromVersion = (versionString) => {
      if (typeof versionString !== 'string') return 1;
      const m = versionString.match(/v\d+\.\d+\.(\d+)/i);
      if (!m) return 1;
      const n = parseInt(m[1], 10);
      return Number.isFinite(n) && n > 0 ? n : 1;
    };

    function App() {
      const [currentDate, setCurrentDate] = useState(() => {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth() + 1, 1);
      });

      const [revision, setRevision] = useState(1);
      const appVersion = `${VERSION_PREFIX}.${revision}`;

      const [staffList, setStaffList] = useState(buildInitialStaff);
      const [shiftList, setShiftList] = useState(DEFAULT_SHIFT_LIST);
      const [schedule, setSchedule] = useState({});
      const [customHolidays, setCustomHolidays] = useState([]);
      const [history, setHistory] = useState([]);
      const [redoHistory, setRedoHistory] = useState([]);
      const [selectedTool, setSelectedTool] = useState('B');
      const [swapSource, setSwapSource] = useState(null);
      const [notification, setNotification] = useState(null);
      const [activeTab, setActiveTab] = useState('schedule');

      const [filterModalOpen, setFilterModalOpen] = useState(false);
      const [holidayPanelOpen, setHolidayPanelOpen] = useState(false);
      const [holidayDraftKeys, setHolidayDraftKeys] = useState([]);

      const [autoGenConfirmOpen, setAutoGenConfirmOpen] = useState(false);
      const [filterWeekdays, setFilterWeekdays] = useState([]);
      const [filterDateKeys, setFilterDateKeys] = useState([]);
      const [lastUndoDesc, setLastUndoDesc] = useState('');

      const [newStaffName, setNewStaffName] = useState('');
      const [dragStaffId, setDragStaffId] = useState(null);

      const [newShiftCode, setNewShiftCode] = useState('');
      const [newShiftLabel, setNewShiftLabel] = useState('');
      const [newShiftTime, setNewShiftTime] = useState('-');
      const [newShiftOt, setNewShiftOt] = useState('0');
      const [newShiftColorKey, setNewShiftColorKey] = useState('indigo');
      const [dragShiftCode, setDragShiftCode] = useState(null);

      const [overviewWindowOpen, setOverviewWindowOpen] = useState(false);

      // ===== 雲端同步狀態 =====
      const [syncState, setSyncState] = useState('idle'); // idle | syncing | success | error
      const [syncText, setSyncText] = useState('尚未同步');
      const [lastSyncTime, setLastSyncTime] = useState('');
      const [dirty, setDirty] = useState(false);

      const fileInputRef = useRef(null);
      const topScrollRef = useRef(null);
      const mainScrollRef = useRef(null);
      const tableRef = useRef(null);
      const syncLock = useRef(false);
      const overviewWinRef = useRef(null);
      const [tableWidth, setTableWidth] = useState(1200);

      const autoSyncTimerRef = useRef(null);
      const syncingRef = useRef(false);
      const initialMountRef = useRef(true);
      const suppressDirtyRef = useRef(false);

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      useEffect(() => {
        document.title = `MRI排班系統 ${appVersion}`;
      }, [appVersion]);

      const shiftMap = useMemo(() => {
        const map = {};
        shiftList.forEach(s => {
          const color = SHIFT_COLOR_OPTIONS.find(c => c.key === s.colorKey) || SHIFT_COLOR_OPTIONS[0];
          map[s.code] = { ...s, colorClass: color.className, cellBg: color.cellBg };
        });
        return map;
      }, [shiftList]);

      const editableShiftTools = useMemo(() => shiftList.map(s => s.code), [shiftList]);

      const days = useMemo(() => {
        const arr = [];
        const firstDay = new Date(year, month, 1);
        const prefixCount = (firstDay.getDay() + 1) % 7;

        for (let i = prefixCount; i >= 1; i--) {
          const dateObj = new Date(year, month, 1 - i);
          const key = toDateKey(dateObj);
          arr.push({
            key,
            fullDate: dateObj,
            date: dateObj.getDate(),
            month: dateObj.getMonth(),
            year: dateObj.getFullYear(),
            dayOfWeek: dateObj.getDay(),
            inCurrentMonth: false,
            isCustomHoliday: customHolidays.includes(key),
            isWeekend: dateObj.getDay() === 0 || dateObj.getDay() === 6 || customHolidays.includes(key)
          });
        }

        for (let i = 1; i <= daysInMonth; i++) {
          const dateObj = new Date(year, month, i);
          const key = toDateKey(dateObj);
          const dayOfWeek = dateObj.getDay();
          const isCustomHoliday = customHolidays.includes(key);
          const isWeekend = dayOfWeek === 0 || dayOfWeek === 6 || isCustomHoliday;
          arr.push({
            key,
            fullDate: dateObj,
            date: i,
            month,
            year,
            dayOfWeek,
            inCurrentMonth: true,
            isCustomHoliday,
            isWeekend
          });
        }
        return arr;
      }, [year, month, daysInMonth, customHolidays]);

      const currentMonthDays = useMemo(() => days.filter(d => d.inCurrentMonth), [days]);
      const currentMonthKeySet = useMemo(() => new Set(currentMonthDays.map(d => d.key)), [currentMonthDays]);

      const holidayCalendarCells = useMemo(() => {
        const first = new Date(year, month, 1);
        const mondayPrefix = (first.getDay() + 6) % 7;
        const cells = [];
        for (let i = 0; i < mondayPrefix; i++) cells.push(null);
        currentMonthDays.forEach(d => cells.push(d));
        while (cells.length % 7 !== 0) cells.push(null);
        return cells;
      }, [year, month, currentMonthDays]);

      const displayDays = useMemo(() => {
        if (filterWeekdays.length === 0 && filterDateKeys.length === 0) return days;
        return days.filter(d => filterWeekdays.includes(d.dayOfWeek) || filterDateKeys.includes(d.key));
      }, [days, filterWeekdays, filterDateKeys]);

      const staffNameMap = useMemo(() => {
        const m = {};
        staffList.forEach(s => m[s.id] = s.name);
        return m;
      }, [staffList]);

      const deepClone = (v) => JSON.parse(JSON.stringify(v));

      const showNotification = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 3000);
      };

      const createSnapshot = (desc = '') => ({
        schedule: deepClone(schedule),
        holidays: [...customHolidays],
        staffList: deepClone(staffList),
        shiftList: deepClone(shiftList),
        revision,
        desc
      });

      const pushHistory = (desc) => {
        const snapshot = createSnapshot(desc);
        setHistory(prev => [...prev.slice(-49), snapshot]);
      };

      const updateAllWithHistory = ({
        nextSchedule = schedule,
        nextHolidays = customHolidays,
        nextStaffList = staffList,
        nextShiftList = shiftList,
        desc = '更新'
      }) => {
        pushHistory(desc);
        setRedoHistory([]);
        setSchedule(nextSchedule);
        setCustomHolidays(nextHolidays);
        setStaffList(nextStaffList);
        setShiftList(nextShiftList);
        setRevision(r => r + 1);
      };

      // ===== 同步工具 =====
      const asBool = (v, defVal = false) => {
        if (v === true || v === false) return v;
        const s = String(v ?? '').trim().toLowerCase();
        if (['1', 'true', 'yes', 'y', 'on'].includes(s)) return true;
        if (['0', 'false', 'no', 'n', 'off'].includes(s)) return false;
        return defVal;
      };

      const asNum = (v, defVal = 0) => {
        const n = Number(v);
        return Number.isFinite(n) ? n : defVal;
      };

      const nowText = () => {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        return `${y}-${m}-${day} ${hh}:${mm}:${ss}`;
      };

      const postToGAS = async (payload) => {
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const text = await resp.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (err) {
          throw new Error(`GAS 回應不是 JSON：${text.slice(0, 120)}`);
        }
        return json;
      };

      const buildCloudImportPayload = () => {
        const staffRows = staffList.map((s, idx) => ({
          人員編號: s.id,
          姓名: s.name,
          優先加班: !!s.preferExtra,
          安排G班: !!s.allowG,
          身分: s.isSupport ? '支援' : '一般',
          MRI排序: idx + 1,
          啟用: true
        }));

        const shiftRows = shiftList.map((s, idx) => ({
          班別編號: s.code,
          班別名稱: s.label,
          時段: s.time || '-',
          加班時數: Number(s.overtime) || 0,
          色彩代碼: s.colorKey || 'gray',
          唯一班別: false,
          適用組別: '全部',
          MRI可見: true,
          MRI排序: idx + 1,
          鎖定: !!s.locked,
          啟用: true
        }));

        const scheduleRows = [];
        Object.keys(schedule || {}).forEach(dateKey => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return;
          const dayObj = schedule[dateKey] || {};
          Object.keys(dayObj).forEach(staffId => {
            const cell = dayObj[staffId] || {};
            if (!staffId) return;
            scheduleRows.push({
              組別: CLOUD_GROUP,
              月份: dateKey.slice(0, 7),
              日期: dateKey,
              人員編號: staffId,
              班別編號: String(cell.shift || 'OFF').trim() || 'OFF',
              業務別: String(cell.call || '').trim(),
              備註: '',
              加班覆寫: '',
              資料來源: 'web'
            });
          });
        });

        // metadata row：保存 holidays / revision / 目前年月
        scheduleRows.push({
          組別: META_GROUP,
          月份: 'META',
          日期: META_DATE,
          人員編號: '__META__',
          班別編號: 'META',
          業務別: '',
          備註: JSON.stringify({
            customHolidays: customHolidays || [],
            revision,
            currentYear: year,
            currentMonth: month,
            savedAt: nowText(),
            appVersion
          }),
          加班覆寫: '',
          資料來源: 'web'
        });

        return {
          staff: staffRows,
          shifts: shiftRows,
          schedule: scheduleRows
        };
      };

      const parseCloudExport = (cloudData) => {
        const staffRows = Array.isArray(cloudData?.staff) ? cloudData.staff : [];
        const shiftRows = Array.isArray(cloudData?.shifts) ? cloudData.shifts : [];
        const scheduleRows = Array.isArray(cloudData?.schedule) ? cloudData.schedule : [];

        const parsedStaff = staffRows
          .slice()
          .sort((a, b) => asNum(a['MRI排序'], 9999) - asNum(b['MRI排序'], 9999))
          .map(r => {
            const id = normalizeStaffId(r['人員編號']);
            return {
              id,
              name: String(r['姓名'] || '').trim() || id,
              preferExtra: asBool(r['優先加班'], false),
              allowG: asBool(r['安排G班'], true),
              isSupport: String(r['身分'] || '').trim() === '支援'
            };
          })
          .filter(s => !!s.id);

        const parsedShift = shiftRows
          .slice()
          .sort((a, b) => asNum(a['MRI排序'], 9999) - asNum(b['MRI排序'], 9999))
          .map(r => ({
            code: String(r['班別編號'] || '').trim(),
            label: String(r['班別名稱'] || '').trim() || String(r['班別編號'] || '').trim(),
            time: String(r['時段'] || '-').trim() || '-',
            overtime: asNum(r['加班時數'], 0),
            colorKey: String(r['色彩代碼'] || 'gray').trim() || 'gray',
            locked: asBool(r['鎖定'], false)
          }))
          .filter(s => !!s.code);

        const shiftMapLocal = new Map(parsedShift.map(s => [s.code, s]));
        DEFAULT_SHIFT_LIST.forEach(def => {
          if (!shiftMapLocal.has(def.code)) shiftMapLocal.set(def.code, def);
        });
        const finalShiftList = Array.from(shiftMapLocal.values());

        const parsedSchedule = {};
        let meta = {};

        scheduleRows.forEach(r => {
          const group = String(r['組別'] || '').trim();
          const date = String(r['日期'] || '').trim();
          const staffIdRaw = String(r['人員編號'] || '').trim();

          if (group === META_GROUP && staffIdRaw === '__META__') {
            try {
              meta = JSON.parse(String(r['備註'] || '{}'));
            } catch (_) {}
            return;
          }

          if (group !== CLOUD_GROUP) return;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
          const staffId = normalizeStaffId(staffIdRaw) || staffIdRaw;
          if (!staffId) return;

          if (!parsedSchedule[date]) parsedSchedule[date] = {};
          parsedSchedule[date][staffId] = {
            shift: String(r['班別編號'] || 'OFF').trim() || 'OFF',
            call: String(r['業務別'] || '').trim()
          };
        });

        const holidays = Array.isArray(meta.customHolidays)
          ? Array.from(new Set(meta.customHolidays.filter(k => /^\d{4}-\d{2}-\d{2}$/.test(String(k)))))
          : [];

        return {
          staffList: parsedStaff.length > 0 ? parsedStaff : buildInitialStaff(),
          shiftList: finalShiftList,
          schedule: parsedSchedule,
          customHolidays: holidays,
          meta
        };
      };

      const syncToCloud = async (isAuto = false) => {
        if (syncingRef.current) {
          if (!isAuto) showNotification('同步進行中，請稍候', 'error');
          return;
        }
        syncingRef.current = true;
        setSyncState('syncing');
        setSyncText(isAuto ? '自動同步中...' : '手動同步中...');

        try {
          const payload = buildCloudImportPayload();
          const result = await postToGAS({
            action: 'importAll',
            app: 'MRI排班系統-Web',
            ...payload
          });

          if (!result?.ok) {
            throw new Error(result?.error || '同步失敗');
          }

          const t = nowText();
          setDirty(false);
          setSyncState('success');
          setSyncText('同步成功');
          setLastSyncTime(t);

          if (!isAuto) showNotification('已強制同步到雲端', 'success');
        } catch (err) {
          setSyncState('error');
          setSyncText(`同步失敗：${String(err.message || err)}`);
          if (!isAuto) showNotification(`同步失敗：${String(err.message || err)}`, 'error');
        } finally {
          syncingRef.current = false;
        }
      };

      const loadFromCloud = async () => {
        if (syncingRef.current) {
          showNotification('目前同步中，請稍候再讀取', 'error');
          return;
        }
        syncingRef.current = true;
        setSyncState('syncing');
        setSyncText('雲端讀取中...');

        try {
          const url = `${GAS_WEBAPP_URL}?action=exportAll&app=MRI排班系統-Web&_t=${Date.now()}`;
          const resp = await fetch(url, { method: 'GET' });
          const text = await resp.text();
          let json;
          try {
            json = JSON.parse(text);
          } catch (err) {
            throw new Error(`雲端回應不是 JSON：${text.slice(0, 120)}`);
          }
          if (!json?.ok) throw new Error(json?.error || '雲端讀取失敗');

          const parsed = parseCloudExport(json.data || {});

          suppressDirtyRef.current = true;
          setSchedule(parsed.schedule || {});
          setCustomHolidays(parsed.customHolidays || []);
          setStaffList(parsed.staffList || buildInitialStaff());
          setShiftList(parsed.shiftList || DEFAULT_SHIFT_LIST);
          setHistory([]);
          setRedoHistory([]);
          setLastUndoDesc('');

          if (Number.isFinite(parsed?.meta?.revision) && parsed.meta.revision > 0) {
            setRevision(parsed.meta.revision);
          } else {
            setRevision(r => r + 1);
          }

          if (
            Number.isInteger(parsed?.meta?.currentYear) &&
            Number.isInteger(parsed?.meta?.currentMonth)
          ) {
            setCurrentDate(new Date(parsed.meta.currentYear, parsed.meta.currentMonth, 1));
          }

          setTimeout(() => { suppressDirtyRef.current = false; }, 0);

          const t = nowText();
          setDirty(false);
          setSyncState('success');
          setSyncText('雲端讀取成功');
          setLastSyncTime(t);
          showNotification('已從雲端讀取資料', 'success');
        } catch (err) {
          setSyncState('error');
          setSyncText(`雲端讀取失敗：${String(err.message || err)}`);
          showNotification(`雲端讀取失敗：${String(err.message || err)}`, 'error');
        } finally {
          syncingRef.current = false;
        }
      };

      // 當核心資料異動，10 秒後自動同步
      useEffect(() => {
        if (initialMountRef.current) {
          initialMountRef.current = false;
          return;
        }
        if (suppressDirtyRef.current) return;

        setDirty(true);
        if (syncState !== 'syncing') {
          setSyncState('idle');
          setSyncText('資料已變更，10秒後自動同步...');
        }

        if (autoSyncTimerRef.current) clearTimeout(autoSyncTimerRef.current);
        autoSyncTimerRef.current = setTimeout(() => {
          syncToCloud(true);
        }, 10000);

        return () => {
          if (autoSyncTimerRef.current) clearTimeout(autoSyncTimerRef.current);
        };
      }, [schedule, customHolidays, staffList, shiftList]);

      useEffect(() => {
        return () => {
          if (autoSyncTimerRef.current) clearTimeout(autoSyncTimerRef.current);
        };
      }, []);

      const requestUndo = () => {
        if (history.length === 0) return;
        const currentSnapshot = createSnapshot('目前狀態');
        setRedoHistory(prev => [...prev.slice(-49), currentSnapshot]);

        const last = history[history.length - 1];
        setHistory(prev => prev.slice(0, -1));
        setSchedule(last.schedule);
        setCustomHolidays(last.holidays);
        setStaffList(last.staffList || buildInitialStaff());
        setShiftList(last.shiftList || DEFAULT_SHIFT_LIST);
        setRevision(last.revision || 1);
        setSwapSource(null);
        setLastUndoDesc(`已復原：${last.desc || '上一步操作'}`);
      };

      const requestRedo = () => {
        if (redoHistory.length === 0) return;
        const currentSnapshot = createSnapshot('目前狀態');
        setHistory(prev => [...prev.slice(-49), currentSnapshot]);

        const next = redoHistory[redoHistory.length - 1];
        setRedoHistory(prev => prev.slice(0, -1));
        setSchedule(next.schedule);
        setCustomHolidays(next.holidays);
        setStaffList(next.staffList || buildInitialStaff());
        setShiftList(next.shiftList || DEFAULT_SHIFT_LIST);
        setRevision(next.revision || 1);
        setSwapSource(null);
        setLastUndoDesc(`已取消復原：${next.desc || '下一步操作'}`);
      };

      const getCell = (srcSchedule, dayObj, staffId) => {
        const key = dayObj.key;
        const direct = srcSchedule[key]?.[staffId];
        if (direct) return direct;
        if (dayObj.inCurrentMonth) return srcSchedule[`day-${dayObj.date}`]?.[staffId];
        return undefined;
      };

      const ensureCell = (targetSchedule, dayObj, staffId) => {
        const key = dayObj.key;
        if (!targetSchedule[key]) targetSchedule[key] = {};
        if (!targetSchedule[key][staffId]) targetSchedule[key][staffId] = { shift: 'OFF', call: '' };
        if (typeof targetSchedule[key][staffId].call !== 'string') targetSchedule[key][staffId].call = '';
        return targetSchedule[key][staffId];
      };

      const calculateDailyStats = (staffId, dayObj, srcSchedule) => {
        const cell = getCell(srcSchedule, dayObj, staffId);
        if (!cell) return { shiftOvertime: 0 };
        const shiftOvertime = shiftMap[cell.shift]?.overtime || 0;
        return { shiftOvertime };
      };

      const checkSevenDayStreak = (staffId, dayObj, srcSchedule) => {
        let consecutiveDays = 0;
        const base = stripTime(dayObj.fullDate);
        for (let i = 0; i < 7; i++) {
          const targetDate = new Date(base);
          targetDate.setDate(base.getDate() - i);
          const targetDayObj = {
            key: toDateKey(targetDate),
            fullDate: targetDate,
            inCurrentMonth: targetDate.getMonth() === month && targetDate.getFullYear() === year,
            date: targetDate.getDate()
          };
          const cell = getCell(srcSchedule, targetDayObj, staffId);
          if (!cell) break;
          const isWorking = (!['OFF', 'OFF*', '國'].includes(cell.shift) || cell.call !== '');
          if (isWorking) consecutiveDays++;
          else break;
        }
        return consecutiveDays >= 7;
      };

      const getWeekInfoBeforeDate = (staffId, dateObj, srcSchedule) => {
        const weekStart = getWeekStartMonday(dateObj);
        const endDate = stripTime(dateObj);
        endDate.setDate(endDate.getDate() - 1);

        let nCount = 0;
        let gCount = 0;
        const specialDates = [];

        for (let cursor = new Date(weekStart); cursor <= endDate; cursor.setDate(cursor.getDate() + 1)) {
          const dayObj = {
            key: toDateKey(cursor),
            fullDate: new Date(cursor),
            inCurrentMonth: cursor.getMonth() === month && cursor.getFullYear() === year,
            date: cursor.getDate()
          };
          const cell = getCell(srcSchedule, dayObj, staffId);
          if (!cell) continue;
          if (cell.shift === 'N') {
            nCount++;
            specialDates.push(stripTime(cursor));
          }
          if (cell.shift === 'G') {
            gCount++;
            specialDates.push(stripTime(cursor));
          }
        }
        return { nCount, gCount, specialDates };
      };

      const isCurrentMonthBlank = useMemo(() => {
        for (const d of currentMonthDays) {
          for (const s of staffList) {
            const cell = getCell(schedule, d, s.id);
            if (!cell) continue;
            const hasShift = typeof cell.shift === 'string' && cell.shift.trim() !== '';
            const hasCall = typeof cell.call === 'string' && cell.call.trim() !== '';
            if (hasShift || hasCall) return false;
          }
        }
        return true;
      }, [schedule, currentMonthDays, staffList]);

      const generateAutoShifts = () => {
        if (!shiftMap.B || !shiftMap.G || !shiftMap.N || !shiftMap.OFF || !shiftMap['OFF*'] || !shiftMap['國']) {
          showNotification('自動排班需要班別 B / G / N / 國 / OFF / OFF* 存在', 'error');
          return;
        }

        const newSchedule = deepClone(schedule);
        const supportIds = staffList.filter(s => s.isSupport).map(s => s.id);
        const autoStaffIds = staffList.filter(s => !s.isSupport).map(s => s.id);
        const gEligibleIds = staffList.filter(s => !s.isSupport && s.allowG).map(s => s.id);
        const priorityIds = staffList.filter(s => !s.isSupport && s.preferExtra).map(s => s.id);

        if (autoStaffIds.length === 0 && supportIds.length === 0) {
          showNotification('目前無可排班人員', 'error');
          return;
        }

        const priorityRank = {};
        priorityIds.forEach((id, idx) => { priorityRank[id] = idx; });

        days.forEach(d => staffList.forEach(s => ensureCell(newSchedule, d, s.id)));

        currentMonthDays.forEach(d => {
          if (!d.isWeekend) {
            staffList.forEach(s => {
              const cell = ensureCell(newSchedule, d, s.id);
              if (cell.shift !== 'OFF*') {
                cell.shift = 'OFF';
                cell.call = '';
              }
            });
          }
        });

        currentMonthDays.forEach(d => {
          if (d.isCustomHoliday) {
            staffList.forEach(s => {
              const c = ensureCell(newSchedule, d, s.id);
              if (c.shift !== 'OFF*') {
                c.shift = '國';
                c.call = '';
              }
            });
          }
        });

        currentMonthDays.forEach(d => {
          if (!d.isWeekend) {
            supportIds.forEach(id => {
              const c = ensureCell(newSchedule, d, id);
              if (c.shift !== 'OFF*') c.shift = 'B';
            });
          }
        });

        const workdays = currentMonthDays.filter(d => !d.isWeekend);
        const totalN = workdays.length * 2;
        const totalG = workdays.length * 2;
        const targetN = buildMonthlyTargets(totalN, autoStaffIds, priorityIds);
        const gPriorityIds = priorityIds.filter(id => gEligibleIds.includes(id));
        const targetG = buildMonthlyTargets(totalG, gEligibleIds, gPriorityIds);

        const monthlyCounts = {};
        autoStaffIds.forEach(id => monthlyCounts[id] = { N: 0, G: 0 });
        const warnings = [];

        const pickSpecial = (dayObj, shiftType, excludeIds = new Set()) => {
          const dayDate = stripTime(dayObj.fullDate);
          const poolIds = shiftType === 'G' ? gEligibleIds : autoStaffIds;

          const available = poolIds.filter(id => {
            if (excludeIds.has(id)) return false;
            const cell = ensureCell(newSchedule, dayObj, id);
            if (cell.shift === 'OFF*' || cell.shift === '國') return false;

            const weekInfo = getWeekInfoBeforeDate(id, dayObj.fullDate, newSchedule);
            if (shiftType === 'N' && weekInfo.nCount >= 1) return false;
            if (shiftType === 'G' && weekInfo.gCount >= 1) return false;

            const spaced = weekInfo.specialDates.every(spDate => {
              const diffDays = Math.abs((dayDate - spDate) / DAY_MS);
              return diffDays >= 2;
            });
            if (!spaced) return false;

            return true;
          });

          const targetMap = shiftType === 'N' ? targetN : targetG;
          available.sort((a, b) => {
            const deficitA = (targetMap[a] || 0) - monthlyCounts[a][shiftType];
            const deficitB = (targetMap[b] || 0) - monthlyCounts[b][shiftType];
            if (deficitA !== deficitB) return deficitB - deficitA;
            if (monthlyCounts[a][shiftType] !== monthlyCounts[b][shiftType]) {
              return monthlyCounts[a][shiftType] - monthlyCounts[b][shiftType];
            }
            const ra = priorityRank[a] ?? 999;
            const rb = priorityRank[b] ?? 999;
            if (ra !== rb) return ra - rb;
            return 0.5 - Math.random();
          });

          return available.slice(0, 2);
        };

        workdays.forEach(d => {
          const pickedN = pickSpecial(d, 'N');
          pickedN.forEach(id => {
            const c = ensureCell(newSchedule, d, id);
            c.shift = 'N';
            monthlyCounts[id].N++;
          });

          const pickedNSet = new Set(pickedN);
          const pickedG = pickSpecial(d, 'G', pickedNSet);
          pickedG.forEach(id => {
            const c = ensureCell(newSchedule, d, id);
            c.shift = 'G';
            monthlyCounts[id].G++;
          });

          const pickedAll = new Set([...pickedN, ...pickedG]);
          autoStaffIds.forEach(id => {
            const c = ensureCell(newSchedule, d, id);
            if (c.shift === 'OFF*') return;
            if (!pickedAll.has(id)) c.shift = 'B';
          });

          if (pickedN.length < 2 || pickedG.length < 2) {
            warnings.push(`${d.month + 1}/${d.date} 無法完整排到 2N2G（受限制）`);
          }
        });

        updateAllWithHistory({ nextSchedule: newSchedule, desc: '自動排班別' });

        if (warnings.length > 0) {
          showNotification(`已完成排班，但有 ${warnings.length} 天未達 2N2G`, 'error');
        } else {
          showNotification('自動排班完成', 'success');
        }
      };

      const handleAutoGenerateRequest = () => {
        if (isCurrentMonthBlank) {
          setAutoGenConfirmOpen(true);
          return;
        }
        generateAutoShifts();
      };

      const handleCellClick = (day, staffId) => {
        if (selectedTool === 'SWAP') {
          if (!swapSource) {
            setSwapSource({ day, staffId });
          } else {
            const newSchedule = deepClone(schedule);
            const sourceCell = ensureCell(newSchedule, swapSource.day, swapSource.staffId);
            const targetCell = ensureCell(newSchedule, day, staffId);
            const temp = { ...sourceCell };
            newSchedule[swapSource.day.key][swapSource.staffId] = { ...targetCell };
            newSchedule[day.key][staffId] = temp;

            const desc = `對調 ${swapSource.day.month + 1}/${swapSource.day.date}(${staffNameMap[swapSource.staffId] || swapSource.staffId}) 與 ${day.month + 1}/${day.date}(${staffNameMap[staffId] || staffId})`;
            updateAllWithHistory({ nextSchedule: newSchedule, desc });
            setSwapSource(null);
          }
          return;
        }

        const newSchedule = deepClone(schedule);
        const currentCell = ensureCell(newSchedule, day, staffId);
        let desc = '';

        if (shiftMap[selectedTool]) {
          currentCell.shift = selectedTool;
          desc = `${day.month + 1}/${day.date} ${staffNameMap[staffId] || staffId} 班別改為 ${selectedTool}`;
        } else if (CALL_COUNT_KEYS.includes(selectedTool)) {
          currentCell.call = currentCell.call === selectedTool ? '' : selectedTool;
          desc = `${day.month + 1}/${day.date} ${staffNameMap[staffId] || staffId} 值班改為 ${currentCell.call || '清除'}`;
        } else if (selectedTool === 'CLEAR_CALL') {
          currentCell.call = '';
          desc = `${day.month + 1}/${day.date} ${staffNameMap[staffId] || staffId} 清除值班`;
        } else {
          return;
        }

        updateAllWithHistory({ nextSchedule: newSchedule, desc: desc || '手動修改排班' });
      };

      const openHolidayPanel = () => {
        const init = customHolidays.filter(k => currentMonthKeySet.has(k));
        setHolidayDraftKeys(init);
        setHolidayPanelOpen(true);
      };

      const applyHolidayPanel = () => {
        const otherMonths = customHolidays.filter(k => !currentMonthKeySet.has(k));
        const merged = Array.from(new Set([...otherMonths, ...holidayDraftKeys]));
        updateAllWithHistory({
          nextHolidays: merged,
          desc: `更新 ${year}年${month + 1}月國定假日（${holidayDraftKeys.length}天）`
        });
        setHolidayPanelOpen(false);
        showNotification(`已更新 ${month + 1} 月國定假日`, 'success');
      };

      const exportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        let header = "人員,";
        currentMonthDays.forEach(d => {
          header += `${d.date}(${DAY_NAMES[d.dayOfWeek]}),`;
        });
        header += "班別加班,值班班別統計\n";
        csvContent += header;

        staffList.forEach(staff => {
          let row = `${staff.name},`;
          let totalShiftOvertime = 0;
          const callCounts = { '21-24':0, '00-04':0, '04-07':0, '00-07':0, 'W1':0, 'W2':0 };

          currentMonthDays.forEach(d => {
            const cell = getCell(schedule, d, staff.id) || { shift: '', call: '' };
            let cellText = cell.shift || '';
            if (cell.call) cellText += `+${cell.call}`;
            row += `"${cellText}",`;
            totalShiftOvertime += calculateDailyStats(staff.id, d, schedule).shiftOvertime;
            if (cell.call && callCounts[cell.call] !== undefined) callCounts[cell.call] += 1;
          });

          const callSummary = CALL_COUNT_KEYS
            .filter(k => callCounts[k] > 0)
            .map(k => `${k}:${callCounts[k]}`)
            .join('、');

          row += `${totalShiftOvertime},"${callSummary}"\n`;
          csvContent += row;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `MRI_schedule_${year}_${month + 1}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const normalizeImportedSchedule = (rawSchedule, importYear, importMonth, idMap) => {
        const normalized = {};
        Object.keys(rawSchedule || {}).forEach(k => {
          const m = k.match(/^day-(\d+)$/);
          let finalKey = k;
          if (m) {
            const dayNum = parseInt(m[1], 10);
            const dt = new Date(importYear, importMonth, dayNum);
            finalKey = toDateKey(dt);
          }

          normalized[finalKey] = {};
          const dayObj = rawSchedule[k] || {};
          Object.keys(dayObj).forEach(oldStaffId => {
            const newStaffId = idMap[oldStaffId] || normalizeStaffId(oldStaffId);
            normalized[finalKey][newStaffId] = dayObj[oldStaffId];
          });
        });
        return normalized;
      };

      const getAvailableMRId = (usedSet) => {
        for (let i = 1; i <= 999; i++) {
          const candidate = normalizeStaffId(String(i));
          if (!usedSet.has(candidate)) return candidate;
        }
        return `MRX${Date.now().toString().slice(-4)}`;
      };

      const exportJSON = () => {
        const data = {
          version: appVersion,
          year, month, schedule, customHolidays, staffList, shiftList,
          timestamp: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `MRI_schedule_backup_${year}_${month + 1}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const importJSON = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.year && data.month !== undefined && data.schedule) {
              const rawImportedStaff = (data.staffList || buildInitialStaff());
              const used = new Set();
              const idMap = {};

              const importedStaff = rawImportedStaff.map(s => {
                const oldId = String(s.id || '').trim();
                let newId = normalizeStaffId(oldId);
                if (!newId) newId = getAvailableMRId(used);
                if (used.has(newId)) newId = getAvailableMRId(used);
                used.add(newId);
                idMap[oldId] = newId;

                return {
                  ...s,
                  id: newId,
                  preferExtra: typeof s.preferExtra === 'boolean' ? s.preferExtra : false,
                  isSupport: !!s.isSupport,
                  allowG: typeof s.allowG === 'boolean' ? s.allowG : !s.isSupport
                };
              });

              const normalized = normalizeImportedSchedule(data.schedule, data.year, data.month, idMap);
              const normalizedHolidays = normalizeImportedHolidays(data.customHolidays || [], data.year, data.month);

              const importedShiftList = (Array.isArray(data.shiftList) && data.shiftList.length > 0)
                ? data.shiftList.map(s => ({
                    code: s.code || '',
                    label: s.label || s.code || '',
                    time: s.time || '-',
                    overtime: Number(s.overtime) || 0,
                    colorKey: s.colorKey || 'indigo',
                    locked: !!s.locked
                  }))
                : DEFAULT_SHIFT_LIST;

              const hasNational = importedShiftList.some(s => s.code === '國');
              const finalShiftList = hasNational
                ? importedShiftList
                : [...importedShiftList, { code: '國', label: '國定假日', time: '-', overtime: 0, colorKey: 'pink', locked: true }];

              setCurrentDate(new Date(data.year, data.month, 1));
              setSchedule(normalized);
              setCustomHolidays(normalizedHolidays);
              setStaffList(importedStaff);
              setShiftList(finalShiftList);
              setHistory([]);
              setRedoHistory([]);
              setLastUndoDesc('');
              setAutoGenConfirmOpen(false);

              const importedRev = parseRevisionFromVersion(data.version);
              setRevision(importedRev);

              showNotification(`成功匯入 ${data.year}年${data.month + 1}月${data.version ? `（${data.version}）` : ''}`, 'success');
            } else {
              showNotification("檔案格式錯誤：缺少必要欄位", 'error');
            }
          } catch (err) {
            showNotification("讀取檔案失敗：JSON 解析錯誤", 'error');
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      };

      const stats = useMemo(() => {
        const data = {};
        staffList.forEach(s => {
          let monthlyShiftOvertime = 0;
          const shiftCountMap = { N: 0, G: 0, A: 0, '國': 0, OFF: 0, 'OFF*': 0 };
          const callCounts = { '21-24':0, '00-04':0, '04-07':0, '00-07':0, 'W1':0, 'W2':0 };

          currentMonthDays.forEach(d => {
            monthlyShiftOvertime += calculateDailyStats(s.id, d, schedule).shiftOvertime;
            const cell = getCell(schedule, d, s.id);
            const shift = cell?.shift;
            const call = cell?.call;
            if (shiftCountMap[shift] !== undefined) shiftCountMap[shift] += 1;
            if (call && callCounts[call] !== undefined) callCounts[call] += 1;
          });

          data[s.id] = { monthlyShiftOvertime, shiftCountMap, callCounts };
        });
        return data;
      }, [schedule, currentMonthDays, staffList, shiftMap]);

      const dailyStats = useMemo(() => {
        const out = {};
        days.forEach(d => {
          let n = 0, g = 0, a = 0;
          staffList.forEach(s => {
            const cell = getCell(schedule, d, s.id);
            const shift = cell?.shift || 'OFF';
            if (shift === 'N') n++;
            if (shift === 'G') g++;
            if (shift === 'A') a++;
          });
          out[d.key] = { n, g, a };
        });
        return out;
      }, [schedule, days, staffList]);

      const getNextStaffId = () => {
        const used = new Set(staffList.map(s => s.id));
        return getAvailableMRId(used);
      };

      const addStaff = () => {
        const name = newStaffName.trim();
        if (!name) return showNotification('請先輸入姓名', 'error');
        const id = getNextStaffId();
        const newMember = { id, name, isSupport: false, preferExtra: false, allowG: true };
        const nextStaff = [...staffList, newMember];
        const newSchedule = deepClone(schedule);
        days.forEach(d => ensureCell(newSchedule, d, id));

        updateAllWithHistory({
          nextSchedule: newSchedule,
          nextStaffList: nextStaff,
          desc: `新增人員 ${name}(${id})`
        });
        setNewStaffName('');
        showNotification(`已新增人員 ${name}(${id})`, 'success');
      };

      const removeStaff = (id) => {
        const target = staffList.find(s => s.id === id);
        if (!target) return;
        if (staffList.length <= 1) return showNotification('至少需保留 1 位人員', 'error');

        const nextStaff = staffList.filter(s => s.id !== id);
        const newSchedule = deepClone(schedule);
        Object.keys(newSchedule).forEach(dayKey => {
          if (newSchedule[dayKey] && newSchedule[dayKey][id]) delete newSchedule[dayKey][id];
        });

        updateAllWithHistory({
          nextSchedule: newSchedule,
          nextStaffList: nextStaff,
          desc: `刪除人員 ${target.name}(${target.id})`
        });
        showNotification(`已刪除 ${target.name}`, 'success');
      };

      const renameStaff = (id, name) => {
        const trimmed = name.trim();
        if (!trimmed) return;
        const nextStaff = staffList.map(s => s.id === id ? { ...s, name: trimmed } : s);
        updateAllWithHistory({ nextStaffList: nextStaff, desc: `修改人員 ${id} 姓名為 ${trimmed}` });
      };

      const changeStaffId = (oldId, newIdRaw) => {
        const newId = normalizeStaffId(newIdRaw);
        if (!newId) return showNotification('編號不可為空', 'error');
        if (oldId === newId) return;
        if (staffList.some(s => s.id === newId)) return showNotification(`編號 ${newId} 已存在`, 'error');

        const nextStaff = staffList.map(s => s.id === oldId ? { ...s, id: newId } : s);
        const newSchedule = deepClone(schedule);

        Object.keys(newSchedule).forEach(dayKey => {
          if (newSchedule[dayKey] && newSchedule[dayKey][oldId]) {
            newSchedule[dayKey][newId] = newSchedule[dayKey][oldId];
            delete newSchedule[dayKey][oldId];
          }
        });

        updateAllWithHistory({
          nextSchedule: newSchedule,
          nextStaffList: nextStaff,
          desc: `人員編號 ${oldId} 改為 ${newId}`
        });
        showNotification(`已更新編號：${oldId} → ${newId}`, 'success');
      };

      const togglePreferExtra = (id) => {
        const target = staffList.find(s => s.id === id);
        if (!target || target.isSupport) return;
        const nextStaff = staffList.map(s => s.id === id ? { ...s, preferExtra: !s.preferExtra } : s);
        updateAllWithHistory({
          nextStaffList: nextStaff,
          desc: `${target.name} ${target.preferExtra ? '取消' : '設定'}優先分配加班`
        });
      };

      const toggleAllowG = (id) => {
        const target = staffList.find(s => s.id === id);
        if (!target || target.isSupport) return;
        const nextStaff = staffList.map(s => s.id === id ? { ...s, allowG: !s.allowG } : s);
        updateAllWithHistory({
          nextStaffList: nextStaff,
          desc: `${target.name} ${target.allowG ? '取消' : '允許'}安排G班`
        });
      };

      const reorderStaff = (dragId, targetId) => {
        if (!dragId || !targetId || dragId === targetId) return;
        const fromIdx = staffList.findIndex(s => s.id === dragId);
        const toIdx = staffList.findIndex(s => s.id === targetId);
        if (fromIdx < 0 || toIdx < 0) return;

        const next = [...staffList];
        const [moved] = next.splice(fromIdx, 1);
        next.splice(toIdx, 0, moved);

        updateAllWithHistory({ nextStaffList: next, desc: `調整人員順序：${moved.name}` });
      };

      const normalizeShiftCode = (raw) => {
        const v = raw.trim();
        return v ? v.toUpperCase() : '';
      };

      const addShift = () => {
        const code = normalizeShiftCode(newShiftCode);
        const label = newShiftLabel.trim();
        const time = newShiftTime.trim() || '-';
        const overtime = Number(newShiftOt);

        if (!code) return showNotification('請輸入班別代碼', 'error');
        if (!label) return showNotification('請輸入班別名稱', 'error');
        if (shiftList.some(s => s.code === code)) return showNotification(`班別 ${code} 已存在`, 'error');
        if (Number.isNaN(overtime)) return showNotification('加班時數需為數字', 'error');

        const nextShiftList = [...shiftList, { code, label, time, overtime, colorKey: newShiftColorKey, locked: false }];

        updateAllWithHistory({ nextShiftList, desc: `新增班別 ${code}` });
        setNewShiftCode('');
        setNewShiftLabel('');
        setNewShiftTime('-');
        setNewShiftOt('0');
        setNewShiftColorKey('indigo');
        showNotification(`已新增班別 ${code}`, 'success');
      };

      const updateShiftField = (code, patch) => {
        const nextShiftList = shiftList.map(s => s.code === code ? { ...s, ...patch } : s);
        updateAllWithHistory({ nextShiftList, desc: `更新班別 ${code}` });
      };

      const changeShiftCode = (oldCode, newCodeRaw) => {
        const newCode = normalizeShiftCode(newCodeRaw);
        if (!newCode) return showNotification('班別代碼不可空白', 'error');
        if (oldCode === newCode) return;
        if (shiftList.some(s => s.code === newCode)) return showNotification(`班別 ${newCode} 已存在`, 'error');

        const target = shiftList.find(s => s.code === oldCode);
        if (!target) return;
        if (target.locked) return showNotification(`班別 ${oldCode} 為系統班別，不可改代碼`, 'error');

        const nextShiftList = shiftList.map(s => s.code === oldCode ? { ...s, code: newCode } : s);
        const newSchedule = deepClone(schedule);

        Object.keys(newSchedule).forEach(dayKey => {
          Object.keys(newSchedule[dayKey] || {}).forEach(staffId => {
            if (newSchedule[dayKey][staffId]?.shift === oldCode) {
              newSchedule[dayKey][staffId].shift = newCode;
            }
          });
        });

        let nextSelected = selectedTool;
        if (selectedTool === oldCode) nextSelected = newCode;

        updateAllWithHistory({
          nextShiftList,
          nextSchedule: newSchedule,
          desc: `班別代碼 ${oldCode} 改為 ${newCode}`
        });
        setSelectedTool(nextSelected);
        showNotification(`已更新班別代碼：${oldCode} → ${newCode}`, 'success');
      };

      const deleteShift = (code) => {
        const target = shiftList.find(s => s.code === code);
        if (!target) return;
        if (target.locked) return showNotification(`班別 ${code} 為系統班別，不可刪除`, 'error');
        if (shiftList.length <= 1) return showNotification('至少需保留 1 種班別', 'error');

        const nextShiftList = shiftList.filter(s => s.code !== code);
        const newSchedule = deepClone(schedule);

        Object.keys(newSchedule).forEach(dayKey => {
          Object.keys(newSchedule[dayKey] || {}).forEach(staffId => {
            if (newSchedule[dayKey][staffId]?.shift === code) {
              newSchedule[dayKey][staffId].shift = 'OFF';
            }
          });
        });

        updateAllWithHistory({
          nextShiftList,
          nextSchedule: newSchedule,
          desc: `刪除班別 ${code}`
        });

        if (selectedTool === code) setSelectedTool('B');
        showNotification(`已刪除班別 ${code}（原排入者改 OFF）`, 'success');
      };

      const reorderShift = (dragCode, targetCode) => {
        if (!dragCode || !targetCode || dragCode === targetCode) return;
        const fromIdx = shiftList.findIndex(s => s.code === dragCode);
        const toIdx = shiftList.findIndex(s => s.code === targetCode);
        if (fromIdx < 0 || toIdx < 0) return;

        const next = [...shiftList];
        const [moved] = next.splice(fromIdx, 1);
        next.splice(toIdx, 0, moved);

        updateAllWithHistory({ nextShiftList: next, desc: `調整班別順序：${moved.code}` });
      };

      useEffect(() => {
        const isSpecialTool = selectedTool === 'SWAP' || selectedTool === 'CLEAR_CALL' || CALL_COUNT_KEYS.includes(selectedTool);
        if (!shiftMap[selectedTool] && !isSpecialTool) setSelectedTool('B');
      }, [shiftList]);

      useEffect(() => {
        const updateWidth = () => {
          if (tableRef.current) {
            setTableWidth(tableRef.current.scrollWidth || 1200);
          }
        };
        updateWidth();
        const t = setTimeout(updateWidth, 80);
        window.addEventListener('resize', updateWidth);
        return () => {
          clearTimeout(t);
          window.removeEventListener('resize', updateWidth);
        };
      }, [displayDays, staffList, schedule, activeTab]);

      useEffect(() => {
        if (!overviewWindowOpen) return;
        const timer = setInterval(() => {
          if (!overviewWinRef.current || overviewWinRef.current.closed) {
            overviewWinRef.current = null;
            setOverviewWindowOpen(false);
          }
        }, 500);
        return () => clearInterval(timer);
      }, [overviewWindowOpen]);

      const onTopScroll = () => {
        if (!topScrollRef.current || !mainScrollRef.current) return;
        if (syncLock.current) return;
        syncLock.current = true;
        mainScrollRef.current.scrollLeft = topScrollRef.current.scrollLeft;
        requestAnimationFrame(() => { syncLock.current = false; });
      };

      const onMainScroll = () => {
        if (!topScrollRef.current || !mainScrollRef.current) return;
        if (syncLock.current) return;
        syncLock.current = true;
        topScrollRef.current.scrollLeft = mainScrollRef.current.scrollLeft;
        requestAnimationFrame(() => { syncLock.current = false; });
      };

      const filterActive = filterWeekdays.length > 0 || filterDateKeys.length > 0;

      const escapeHtml = (v) => String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      const buildOverviewWindowHTML = () => {
        const dayHeaders = displayDays.map(d => {
          const weekend = d.isWeekend;
          const bg = weekend ? '#fef2f2' : '#ecfdf5';
          const color = weekend ? '#dc2626' : '#065f46';
          const label = d.inCurrentMonth ? `${d.date}` : `${d.month + 1}/${d.date}`;
          return `
            <th style="min-width:56px;border:1px solid #cfe9df;background:${bg};color:${color};padding:4px;text-align:center;">
              <div style="font-size:11px;font-weight:700;">${label}</div>
              <div style="font-size:10px;">${DAY_NAMES[d.dayOfWeek]}</div>
              ${d.isCustomHoliday ? '<div style="font-size:10px;margin-top:2px;background:#fecdd3;color:#9f1239;border-radius:4px;padding:0 4px;display:inline-block;">國定</div>' : ''}
            </th>
          `;
        }).join('');

        const rows = staffList.map(staff => {
          const leftCell = `
            <td style="position:sticky;left:0;z-index:3;background:#fff;border:1px solid #cfe9df;padding:4px;min-width:92px;text-align:center;">
              <div style="font-size:10px;color:#10b981;">${escapeHtml(formatStaffId(staff.id))}</div>
              <div style="font-size:13px;font-weight:800;letter-spacing:0.4px;">${escapeHtml(staff.name)}</div>
              ${staff.isSupport ? '<div style="font-size:10px;color:#2563eb;">(支援)</div>' : ''}
            </td>
          `;

          const dayCells = displayDays.map(d => {
            const cell = getCell(schedule, d, staff.id) || { shift: '', call: '' };
            const key = shiftMap[cell.shift]?.colorKey || 'gray';
            const c = OVERVIEW_COLOR[key] || OVERVIEW_COLOR.gray;
            const bg = cell.shift ? c.bg : (d.inCurrentMonth ? '#ffffff' : '#f8fafc');
            const text = c.text;
            const streak = checkSevenDayStreak(staff.id, d, schedule);

            return `
              <td style="border:${streak ? '2px solid #ef4444' : '1px solid #cfe9df'};background:${bg};padding:2px;text-align:center;height:42px;vertical-align:top;min-width:56px;">
                ${cell.shift ? `<div style="font-size:12px;font-weight:800;color:${text};line-height:1.1;">${escapeHtml(cell.shift)}</div>` : ''}
                ${cell.call ? `<div style="margin-top:2px;font-size:9px;background:#ffedd5;color:#9a3412;border-radius:4px;display:inline-block;padding:0 3px;">${escapeHtml(cell.call)}</div>` : ''}
              </td>
            `;
          }).join('');

          return `<tr>${leftCell}${dayCells}</tr>`;
        }).join('');

        const manpowerRow = displayDays.map(d => {
          const ds = dailyStats[d.key] || { n: 0, g: 0, a: 0 };
          const isWeekday = d.dayOfWeek >= 1 && d.dayOfWeek <= 5;
          const needsValidate = d.inCurrentMonth && isWeekday && !d.isCustomHoliday;
          const isValid = needsValidate ? (ds.n >= 2 && ds.g >= 2) : true;
          const color = needsValidate && !isValid ? '#dc2626' : '#065f46';
          return `
            <td style="border:1px solid #cfe9df;background:#d1fae5;color:${color};padding:3px;text-align:center;min-width:56px;font-size:10px;font-weight:700;">
              <div>N:${ds.n}</div><div>G:${ds.g}</div><div>A:${ds.a}</div>
            </td>
          `;
        }).join('');

        return `<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MRI 一頁總覽</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ecfdf5; font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    color: #064e3b; overflow: auto;
  }
  .bar {
    position: sticky; top: 0; z-index: 20; background: #ffffff;
    border-bottom: 1px solid #cfe9df; padding: 8px 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px;
  }
  .badge { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; border-radius: 999px; padding: 2px 8px; font-weight: 700; }
  .wrap { padding: 8px; }
  .fit-box { transform-origin: top left; }
  table { border-collapse: collapse; background: #fff; }
  thead th { position: sticky; top: 0; z-index: 2; }
</style>
</head>
<body>
  <div class="bar">
    <div><strong>MRI 一頁總覽（右側統計欄已自動隱藏）</strong><span style="margin-left:8px;">${year}年${month + 1}月</span></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="badge">縮放：<span id="ratio">100%</span></span>
      <button onclick="window.close()" style="border:1px solid #cfe9df;background:#f0fdf4;color:#065f46;border-radius:6px;padding:4px 8px;cursor:pointer;">關閉</button>
    </div>
  </div>
  <div class="wrap">
    <div id="fitBox" class="fit-box">
      <table id="tbl">
        <thead>
          <tr>
            <th style="position:sticky;left:0;z-index:4;background:#ffffff;border:1px solid #cfe9df;padding:4px;min-width:92px;">人員</th>
            ${dayHeaders}
          </tr>
        </thead>
        <tbody>
          ${rows}
          <tr>
            <td style="position:sticky;left:0;z-index:4;background:#d1fae5;border:1px solid #cfe9df;padding:4px;text-align:center;font-size:10px;font-weight:800;">每日人力<br>(N/G/A)</td>
            ${manpowerRow}
          </tr>
        </tbody>
      </table>
    </div>
  </div>
<script>
(function(){
  function fit() {
    var box = document.getElementById('fitBox');
    var tbl = document.getElementById('tbl');
    if (!box || !tbl) return;
    var availW = Math.max(1, window.innerWidth - 20);
    var availH = Math.max(1, window.innerHeight - 90);
    var tw = Math.max(1, tbl.scrollWidth);
    var th = Math.max(1, tbl.scrollHeight);
    var scale = Math.min(1, availW / tw, availH / th);
    box.style.transform = 'scale(' + scale + ')';
    var ratio = document.getElementById('ratio');
    if (ratio) ratio.textContent = Math.round(scale * 100) + '%';
    box.style.width = tw + 'px';
    box.style.height = th + 'px';
    box.parentElement.style.width = (tw * scale) + 'px';
    box.parentElement.style.height = (th * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  setTimeout(fit, 30);
  setTimeout(fit, 180);
})();
<\/script>
</body>
</html>`;
      };

      const renderOverviewWindow = () => {
        const win = overviewWinRef.current;
        if (!win || win.closed) return;
        const html = buildOverviewWindowHTML();
        win.document.open();
        win.document.write(html);
        win.document.close();
      };

      const openOverviewWindow = () => {
        if (overviewWinRef.current && !overviewWinRef.current.closed) {
          overviewWinRef.current.focus();
          renderOverviewWindow();
          setOverviewWindowOpen(true);
          return;
        }

        const sw = window.screen?.availWidth || 1400;
        const sh = window.screen?.availHeight || 900;
        const w = Math.max(960, sw - 60);
        const h = Math.max(700, sh - 80);
        const left = Math.max(0, Math.floor((sw - w) / 2));
        const top = Math.max(0, Math.floor((sh - h) / 2));

        const newWin = window.open(
          '',
          'mri_overview_window',
          `popup=yes,width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`
        );

        if (!newWin) {
          showNotification('無法開啟新視窗，請允許彈出視窗', 'error');
          return;
        }

        overviewWinRef.current = newWin;
        setOverviewWindowOpen(true);
        renderOverviewWindow();
        newWin.focus();
      };

      const closeOverviewWindow = () => {
        if (overviewWinRef.current && !overviewWinRef.current.closed) {
          overviewWinRef.current.close();
        }
        overviewWinRef.current = null;
        setOverviewWindowOpen(false);
      };

      useEffect(() => {
        if (overviewWindowOpen) renderOverviewWindow();
      }, [overviewWindowOpen, displayDays, staffList, schedule, customHolidays, year, month, shiftList]);

      const renderScheduleTable = () => (
        <table ref={tableRef} className="w-full border-collapse min-w-max">
          <thead className="sticky top-0 z-20 bg-white shadow-sm">
            <tr>
              <th className="sticky left-0 z-30 bg-white border border-emerald-200 p-2 min-w-28">人員</th>
              {displayDays.map(d => (
                <th key={d.key} className={`border border-emerald-200 p-1 min-w-16 text-center ${d.isWeekend ? 'bg-red-50 text-red-600' : 'bg-emerald-50'} ${d.inCurrentMonth ? '' : 'opacity-80'}`}>
                  <div className="text-xs">{d.inCurrentMonth ? d.date : `${d.month + 1}/${d.date}`}</div>
                  <div className="text-xs font-normal">{DAY_NAMES[d.dayOfWeek]}</div>
