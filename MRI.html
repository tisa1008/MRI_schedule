                </th>
              ))}
              <th className="sticky right-0 z-30 bg-white border border-emerald-200 p-2 min-w-52">統計</th>
            </tr>
          </thead>
          <tbody>
            {staffList.map(staff => (
              <tr key={staff.id} className="hover:bg-emerald-50">
                <td className="sticky left-0 z-10 bg-white border border-emerald-200 p-2 font-medium text-center">
                  <div className="text-emerald-500 text-xs mb-1">{formatStaffId(staff.id)}</div>
                  <div className="text-lg font-extrabold tracking-wide">{staff.name}</div>
                  {staff.isSupport && <span className="block text-xs text-blue-500 mt-1">(支援)</span>}
                </td>

                {displayDays.map(d => {
                  const cell = getCell(schedule, d, staff.id) || { shift: '', call: '' };
                  const dayStats = calculateDailyStats(staff.id, d, schedule);
                  const isSevenDayStreak = checkSevenDayStreak(staff.id, d, schedule);
                  const isSwapTarget = swapSource && swapSource.day.key === d.key && swapSource.staffId === staff.id;

                  let bgClass = d.inCurrentMonth ? 'bg-white' : 'bg-slate-50';
                  if (cell.shift && shiftMap[cell.shift]?.cellBg) bgClass = shiftMap[cell.shift].cellBg;
                  if (isSwapTarget) bgClass = 'bg-indigo-200 ring-2 ring-indigo-500';

                  let borderClass = 'border border-emerald-200';
                  if (isSevenDayStreak) borderClass = 'border-2 border-red-500 z-10';

                  return (
                    <td
                      key={d.key}
                      className={`${borderClass} p-1 text-center cursor-pointer transition-colors relative h-16 align-top ${bgClass}`}
                      onClick={() => handleCellClick(d, staff.id)}
                    >
                      {cell.shift && (
                        <div className={`font-bold text-sm ${shiftMap[cell.shift]?.colorClass?.split(' ').slice(1).join(' ') || ''}`}>
                          {cell.shift}
                        </div>
                      )}
                      {cell.call && (
                        <div className="text-xs mt-1 bg-orange-100 text-orange-800 rounded px-1 inline-block">
                          {cell.call}
                        </div>
                      )}
                      <div className="absolute top-0 right-0 flex flex-col items-end p-1">
                        {isSevenDayStreak && (
                          <div className="text-red-600 bg-white rounded-full" title="已連續工作7天(含值班)">
                            <Icons.AlertTriangle className="w-3 h-3" />
                          </div>
                        )}
                      </div>
                      {dayStats.shiftOvertime > 0 && <div className="text-xs text-red-400 mt-1">+{dayStats.shiftOvertime}h</div>}
                    </td>
                  );
                })}

                <td className="sticky right-0 z-10 bg-white border border-emerald-200 p-2 text-xs">
                  <div className="flex flex-col gap-1">
                    <span className="font-bold text-lg text-red-600">{stats[staff.id]?.monthlyShiftOvertime}h</span>
                    <span className="text-emerald-600 text-xs">班別加班總時數</span>
                    <div className="text-emerald-700 mt-1 flex flex-wrap gap-2">
                      {PERSON_SHIFT_COUNT_KEYS.map(code => (
                        <span key={code}>{code}:{stats[staff.id]?.shiftCountMap?.[code] ?? 0}</span>
                      ))}
                    </div>
                    <div className="mt-1 flex flex-wrap gap-1">
                      {CALL_COUNT_KEYS.map(k => {
                        const c = stats[staff.id]?.callCounts?.[k] || 0;
                        if (c <= 0) return null;
                        return (
                          <span key={k} className="px-1 py-0.5 rounded bg-orange-100 text-orange-800 text-xs">
                            {k}:{c}
                          </span>
                        );
                      })}
                    </div>
                  </div>
                </td>
              </tr>
            ))}

            <tr className="bg-emerald-100 font-bold text-xs">
              <td className="sticky left-0 z-10 bg-emerald-100 border border-emerald-200 p-2 text-center">
                每日人力<br/><span className="text-xs font-normal text-emerald-700">(僅 N/G/A，含支援)</span>
              </td>
              {displayDays.map(d => {
                const ds = dailyStats[d.key] || { n: 0, g: 0, a: 0 };
                const isWeekday = d.dayOfWeek >= 1 && d.dayOfWeek <= 5;
                const needsValidate = d.inCurrentMonth && isWeekday && !d.isCustomHoliday;
                const isValid = needsValidate ? (ds.n >= 2 && ds.g >= 2) : true;

                return (
                  <td key={d.key} className={`border border-emerald-200 p-1 text-center ${needsValidate && !isValid ? 'text-red-600' : 'text-emerald-700'}`}>
                    <div>N:{ds.n}</div>
                    <div>G:{ds.g}</div>
                    <div>A:{ds.a}</div>
                  </td>
                );
              })}
              <td className="sticky right-0 z-10 bg-emerald-100 border border-emerald-200"></td>
            </tr>
          </tbody>
        </table>
      );

      const syncStatusClass =
        syncState === 'syncing' ? 'bg-blue-50 text-blue-700 border-blue-200' :
        syncState === 'success' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
        syncState === 'error' ? 'bg-red-50 text-red-700 border-red-200' :
        dirty ? 'bg-amber-50 text-amber-700 border-amber-200' :
        'bg-gray-50 text-gray-700 border-gray-200';

      return (
        <div className="flex flex-col h-screen bg-emerald-50 text-sm font-sans relative">

          {notification && (
            <div className={`fixed bottom-4 right-4 z-50 px-4 py-3 rounded shadow-lg flex items-center gap-2 toast-enter ${notification.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}`}>
              {notification.type === 'success' ? <Icons.CheckCircle className="w-5 h-5" /> : <Icons.XCircle className="w-5 h-5" />}
              <span>{notification.message}</span>
            </div>
          )}

          {autoGenConfirmOpen && (
            <div className="fixed inset-0 z-50 bg-black bg-opacity-40 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg shadow-lg w-full max-w-lg p-5">
                <h3 className="text-lg font-bold mb-3 flex items-center gap-2 text-amber-700">
                  <Icons.AlertTriangle className="w-5 h-5" />
                  自動排班前提醒
                </h3>
                <p className="text-sm text-emerald-900 leading-relaxed">
                  目前當月班表為空白。<br />
                  請先確認 <span className="font-semibold">人員管理</span> 與 <span className="font-semibold">國定假日設定</span> 是否正確，再開始自動排班。
                </p>
                <div className="mt-5 flex justify-end gap-2">
                  <button className="px-3 py-2 rounded border border-emerald-300 text-emerald-700" onClick={() => setAutoGenConfirmOpen(false)}>
                    取消
                  </button>
                  <button
                    className="px-3 py-2 rounded bg-emerald-600 text-white hover:bg-emerald-700"
                    onClick={() => {
                      setAutoGenConfirmOpen(false);
                      generateAutoShifts();
                    }}
                  >
                    已確認
                  </button>
                </div>
              </div>
            </div>
          )}

          {holidayPanelOpen && (
            <div className="fixed inset-0 z-50 bg-black bg-opacity-40 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg shadow-lg w-full max-w-5xl p-5 max-h-screen overflow-auto">
                <h3 className="text-lg font-bold mb-3 flex items-center gap-2 text-pink-700">
                  <Icons.Calendar className="w-5 h-5" />
                  國定假日月份面板（{year}年{month + 1}月）
                </h3>

                <div className="mb-4 text-xs text-emerald-700">
                  月曆模式（星期一為第一天）。可一次勾選多個日期，按「套用」後更新本月份設定。
                </div>

                <div className="grid grid-cols-7 gap-1 mb-2">
                  {MONDAY_FIRST_DAY_NAMES.map((n) => (
                    <div key={n} className="text-center text-xs font-semibold py-2 bg-emerald-50 border border-emerald-200 rounded">
                      週{n}
                    </div>
                  ))}
                </div>

                <div className="grid grid-cols-7 gap-1 mb-4">
                  {holidayCalendarCells.map((d, idx) => {
                    if (!d) return <div key={`blank-${idx}`} className="h-20 bg-gray-50 border border-gray-100 rounded"></div>;
                    const checked = holidayDraftKeys.includes(d.key);
                    const weekend = d.dayOfWeek === 0 || d.dayOfWeek === 6;
                    return (
                      <label
                        key={d.key}
                        className={`h-20 p-2 rounded border cursor-pointer flex flex-col justify-between ${
                          checked ? 'bg-pink-100 border-pink-400' : weekend ? 'bg-red-50 border-red-200' : 'bg-white border-emerald-200'
                        }`}
                      >
                        <span className="text-sm font-semibold">{d.date}</span>
                        <span className="text-xs">
                          <input
                            type="checkbox"
                            checked={checked}
                            onChange={(e) => {
                              if (e.target.checked) setHolidayDraftKeys(prev => [...prev, d.key]);
                              else setHolidayDraftKeys(prev => prev.filter(k => k !== d.key));
                            }}
                          /> 國定
                        </span>
                      </label>
                    );
                  })}
                </div>

                <div className="flex flex-wrap gap-2 mb-4">
                  <button className="px-3 py-2 rounded border border-red-300 bg-red-50 text-red-700" onClick={() => setHolidayDraftKeys([])}>
                    全清空
                  </button>
                </div>

                <div className="flex justify-end gap-2">
                  <button className="px-3 py-2 rounded border border-emerald-300" onClick={() => setHolidayPanelOpen(false)}>取消</button>
                  <button className="px-3 py-2 rounded bg-pink-600 text-white hover:bg-pink-700" onClick={applyHolidayPanel}>套用</button>
                </div>
              </div>
            </div>
          )}

          {filterModalOpen && (
            <div className="fixed inset-0 z-50 bg-black bg-opacity-40 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg shadow-lg w-full max-w-4xl p-5 max-h-screen overflow-auto">
                <h3 className="text-lg font-bold mb-4 flex items-center gap-2 text-emerald-800">
                  <Icons.Filter className="w-5 h-5" /> 顯示篩選（星期 / 日期）
                </h3>

                <div className="mb-4">
                  <div className="font-semibold mb-2">星期選擇</div>
                  <div className="flex flex-wrap gap-2">
                    {DAY_NAMES.map((name, idx) => (
                      <label key={idx} className={`px-3 py-1 rounded border cursor-pointer ${filterWeekdays.includes(idx) ? 'bg-emerald-100 border-emerald-400' : 'bg-white border-emerald-200'}`}>
                        <input
                          type="checkbox"
                          className="mr-1"
                          checked={filterWeekdays.includes(idx)}
                          onChange={(e) => {
                            if (e.target.checked) setFilterWeekdays(prev => [...prev, idx]);
                            else setFilterWeekdays(prev => prev.filter(v => v !== idx));
                          }}
                        />
                        週{name}
                      </label>
                    ))}
                  </div>
                </div>

                <div className="mb-4">
                  <div className="font-semibold mb-2">日期選擇</div>
                  <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
                    {days.map(d => (
                      <label key={d.key} className={`px-2 py-1 rounded border cursor-pointer text-xs ${filterDateKeys.includes(d.key) ? 'bg-emerald-100 border-emerald-400' : 'bg-white border-emerald-200'}`}>
                        <input
                          type="checkbox"
                          className="mr-1"
                          checked={filterDateKeys.includes(d.key)}
                          onChange={(e) => {
                            if (e.target.checked) setFilterDateKeys(prev => [...prev, d.key]);
                            else setFilterDateKeys(prev => prev.filter(k => k !== d.key));
                          }}
                        />
                        {d.inCurrentMonth ? `${d.date}(${DAY_NAMES[d.dayOfWeek]})` : `${d.month + 1}/${d.date}(${DAY_NAMES[d.dayOfWeek]})`}
                      </label>
                    ))}
                  </div>
                </div>

                <div className="flex justify-between items-center">
                  <button
                    className="px-3 py-2 rounded border bg-emerald-50 border-emerald-200"
                    onClick={() => {
                      setFilterWeekdays([]);
                      setFilterDateKeys([]);
                    }}
                  >
                    清除全部勾選（恢復全顯示）
                  </button>
                  <div className="flex gap-2">
                    <button className="px-3 py-2 rounded border border-emerald-300" onClick={() => setFilterModalOpen(false)}>關閉</button>
                    <button
                      className="px-3 py-2 rounded bg-emerald-600 text-white"
                      onClick={() => {
                        setFilterModalOpen(false);
                        showNotification(filterActive ? '已更新篩選' : '目前為全顯示', 'success');
                      }}
                    >
                      套用
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          <div className="bg-white border-b border-emerald-200 p-4 shadow-sm flex flex-col gap-4">
            <div className="flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center gap-4">
                <h1 className="text-2xl font-bold text-emerald-800 flex items-center gap-2">
                  <Icons.Calendar className="w-6 h-6" />
                  MRI排班系統
                  <span className="text-sm font-semibold px-2 py-1 rounded bg-emerald-100 text-emerald-700 border border-emerald-200">
                    {appVersion}
                  </span>
                </h1>

                <div className={`px-3 py-2 rounded border text-xs ${syncStatusClass}`}>
                  <div className="font-semibold">同步狀態：{syncText}</div>
                  <div className="opacity-80 mt-0.5">
                    {lastSyncTime ? `最近同步：${lastSyncTime}` : '最近同步：尚未同步'}
                    {dirty ? ' ｜ 本機有未同步變更' : ''}
                  </div>
                </div>

                <div className="flex items-center gap-2 bg-emerald-50 p-1 rounded border border-emerald-200">
                  <button
                    className={`px-3 py-1 rounded ${activeTab === 'schedule' ? 'bg-white shadow font-semibold text-emerald-700' : ''}`}
                    onClick={() => setActiveTab('schedule')}
                  >
                    排班表
                  </button>
                  <button
                    className={`px-3 py-1 rounded flex items-center gap-1 ${activeTab === 'staff' ? 'bg-white shadow font-semibold text-emerald-700' : ''}`}
                    onClick={() => setActiveTab('staff')}
                  >
                    <Icons.Users className="w-4 h-4" />
                    人員管理
                  </button>
                  <button
                    className={`px-3 py-1 rounded flex items-center gap-1 ${activeTab === 'shift' ? 'bg-white shadow font-semibold text-emerald-700' : ''}`}
                    onClick={() => setActiveTab('shift')}
                  >
                    <Icons.Settings className="w-4 h-4" />
                    班別管理
                  </button>
                </div>

                <div className="flex items-center gap-2 bg-emerald-50 p-1 rounded border border-emerald-200">
                  <select value={year} onChange={(e) => setCurrentDate(new Date(parseInt(e.target.value), month, 1))} className="bg-transparent font-bold p-1 outline-none">
                    {[year-1, year, year+1].map(y => <option key={y} value={y}>{y}年</option>)}
                  </select>
                  <select value={month} onChange={(e) => setCurrentDate(new Date(year, parseInt(e.target.value), 1))} className="bg-transparent font-bold p-1 outline-none">
                    {Array.from({length: 12}, (_, i) => <option key={i} value={i}>{i + 1}月</option>)}
                  </select>
                </div>
              </div>

              <div className="flex flex-wrap gap-2">
                <input type="file" accept=".json" ref={fileInputRef} className="hidden" onChange={importJSON} />
                <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-1 px-3 py-2 bg-emerald-600 text-white hover:bg-emerald-700 rounded">
                  <Icons.Upload className="w-4 h-4" /> 匯入
                </button>
                <button onClick={exportJSON} className="flex items-center gap-1 px-3 py-2 bg-emerald-600 text-white hover:bg-emerald-700 rounded">
                  <Icons.Download className="w-4 h-4" /> 匯出
                </button>

                <button onClick={() => syncToCloud(false)} className="flex items-center gap-1 px-3 py-2 bg-sky-600 text-white hover:bg-sky-700 rounded">
                  <Icons.Upload className="w-4 h-4" /> 強制同步
                </button>
                <button onClick={loadFromCloud} className="flex items-center gap-1 px-3 py-2 bg-violet-600 text-white hover:bg-violet-700 rounded">
                  <Icons.Download className="w-4 h-4" /> 雲端讀取
                </button>

                <div className="w-px h-8 bg-emerald-300 mx-2"></div>

                <button onClick={requestUndo} disabled={history.length === 0} className="flex items-center gap-1 px-3 py-2 bg-emerald-100 hover:bg-emerald-200 rounded disabled:opacity-50 disabled:cursor-not-allowed border border-emerald-200">
                  <Icons.RotateCcw className="w-4 h-4" /> 復原 ({history.length})
                </button>
                <button onClick={requestRedo} disabled={redoHistory.length === 0} className="flex items-center gap-1 px-3 py-2 bg-indigo-100 hover:bg-indigo-200 rounded disabled:opacity-50 disabled:cursor-not-allowed border border-indigo-200">
                  <Icons.Redo className="w-4 h-4" /> 取消復原 ({redoHistory.length})
                </button>

                {activeTab === 'schedule' && (
                  <>
                    <button onClick={handleAutoGenerateRequest} className="flex items-center gap-1 px-3 py-2 bg-teal-600 text-white hover:bg-teal-700 rounded">
                      <Icons.Clock className="w-4 h-4" /> 自動排班別
                    </button>
                    <button onClick={openHolidayPanel} className="flex items-center gap-1 px-3 py-2 bg-pink-600 text-white hover:bg-pink-700 rounded">
                      <Icons.Calendar className="w-4 h-4" /> 國定假日面板
                    </button>
                    <button onClick={exportCSV} className="flex items-center gap-1 px-3 py-2 bg-lime-600 text-white hover:bg-lime-700 rounded">
                      <Icons.FileSpreadsheet className="w-4 h-4" /> 匯出 Excel
                    </button>
                    <button onClick={() => setFilterModalOpen(true)} className={`flex items-center gap-1 px-3 py-2 rounded ${filterActive ? 'bg-amber-500 text-white' : 'bg-amber-100 text-amber-800 hover:bg-amber-200'}`}>
                      {filterActive ? <Icons.EyeOff className="w-4 h-4" /> : <Icons.Filter className="w-4 h-4" />}
                      顯示篩選
                    </button>
                    <button
                      onClick={() => overviewWindowOpen ? closeOverviewWindow() : openOverviewWindow()}
                      className={`flex items-center gap-1 px-3 py-2 rounded ${overviewWindowOpen ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-indigo-100 text-indigo-800 hover:bg-indigo-200'}`}
                    >
                      {overviewWindowOpen ? <Icons.Maximize className="w-4 h-4" /> : <Icons.Minimize className="w-4 h-4" />}
                      {overviewWindowOpen ? '關閉總覽視窗' : '一頁總覽縮小'}
                    </button>
                  </>
                )}
              </div>
            </div>

            {activeTab === 'schedule' && (
              <div className="flex flex-wrap gap-4 items-center p-2 bg-emerald-50 rounded border border-emerald-200">
                <span className="font-semibold text-emerald-700">工具:</span>

                <div className="flex flex-wrap gap-1 border-r border-emerald-200 pr-4">
                  {editableShiftTools.map(code => {
                    const s = shiftMap[code];
                    if (!s) return null;
                    return (
                      <button key={code} onClick={() => { setSelectedTool(code); setSwapSource(null); }} className={`px-3 py-1 rounded border ${selectedTool === code ? 'ring-2 ring-offset-1 ring-emerald-500 font-bold' : ''} ${s.colorClass}`}>
                        {code}
                      </button>
                    );
                  })}
                </div>

                <div className="flex flex-wrap gap-1 border-r border-emerald-200 pr-4">
                  {CALL_TYPES.map(type => (
                    <button
                      key={type.code}
                      onClick={() => { setSelectedTool(type.code); setSwapSource(null); }}
                      className={`px-3 py-1 rounded border bg-orange-50 text-orange-800 border-orange-200 ${selectedTool === type.code ? 'ring-2 ring-offset-1 ring-orange-500 font-bold' : ''}`}
                    >
                      {type.code}
                    </button>
                  ))}
                  <button
                    onClick={() => { setSelectedTool('CLEAR_CALL'); setSwapSource(null); }}
                    className={`px-3 py-1 rounded border bg-red-50 text-red-800 border-red-200 ${selectedTool === 'CLEAR_CALL' ? 'ring-2 ring-offset-1 ring-red-500 font-bold' : ''}`}
                  >
                    清除值班
                  </button>
                </div>

                <button onClick={() => { setSelectedTool('SWAP'); setSwapSource(null); }} className={`flex items-center gap-1 px-3 py-1 rounded border bg-indigo-50 text-indigo-800 border-indigo-200 ${selectedTool === 'SWAP' ? 'ring-2 ring-offset-1 ring-indigo-500 font-bold' : ''}`}>
                  <Icons.ArrowLeftRight className="w-4 h-4" /> 對調
                </button>

                <div className="ml-auto text-emerald-700 text-xs">
                  當前模式:
                  <span className="font-bold text-emerald-900 ml-1">
                    {selectedTool === 'SWAP'
                      ? '對調班別'
                      : CALL_COUNT_KEYS.includes(selectedTool)
                      ? `填入值班 ${selectedTool}`
                      : selectedTool === 'CLEAR_CALL'
                      ? '清除值班'
                      : `填入 ${selectedTool}`
                    }
                  </span>
                  {filterActive && <span className="ml-2 text-amber-700 font-semibold">（篩選顯示中）</span>}
                  {overviewWindowOpen && <span className="ml-2 text-indigo-700 font-semibold">（總覽新視窗開啟中：右側統計欄已隱藏）</span>}
                  {lastUndoDesc && <span className="ml-2 text-teal-700 font-semibold">｜{lastUndoDesc}</span>}
                </div>
              </div>
            )}
          </div>

          {activeTab === 'staff' && (
            <div className="p-4 overflow-auto">
              <div className="bg-white rounded border border-emerald-200 p-4 max-w-7xl">
                <h2 className="text-lg font-bold mb-3 flex items-center gap-2 text-emerald-800">
                  <Icons.Users className="w-5 h-5" />
                  人員管理
                </h2>

                <div className="flex gap-2 mb-4">
                  <input
                    className="border border-emerald-300 rounded px-3 py-2 flex-1"
                    placeholder="輸入新增人員姓名"
                    value={newStaffName}
                    onChange={(e) => setNewStaffName(e.target.value)}
                  />
                  <button onClick={addStaff} className="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700">
                    新增人員
                  </button>
                </div>

                <div className="text-xs text-emerald-700 mb-3">
                  每位人員固定 1 列顯示，可拖曳排序、修改編號、設定加班優先與 G 班資格。
                </div>

                <div className="overflow-auto border border-emerald-200 rounded" style={{ maxHeight: '70vh' }}>
                  <table className="min-w-max w-full border-collapse">
                    <thead className="bg-emerald-50">
                      <tr>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-14">拖曳</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-28">編號</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center">姓名</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-32">優先加班</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-32">安排 G 班</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-24">身分</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-24">操作</th>
                      </tr>
                    </thead>
                    <tbody>
                      {staffList.map((s) => (
                        <tr
                          key={s.id}
                          draggable
                          onDragStart={() => setDragStaffId(s.id)}
                          onDragOver={(e) => e.preventDefault()}
                          onDrop={() => {
                            reorderStaff(dragStaffId, s.id);
                            setDragStaffId(null);
                          }}
                          onDragEnd={() => setDragStaffId(null)}
                          className={`${dragStaffId === s.id ? 'opacity-70' : ''} bg-white hover:bg-emerald-50`}
                        >
                          <td className="border border-emerald-200 p-2 text-center cursor-move select-none">↕</td>

                          <td className="border border-emerald-200 p-2">
                            <input
                              className="w-full h-9 border border-emerald-300 rounded px-2 font-mono text-center"
                              defaultValue={formatStaffId(s.id)}
                              onBlur={(e) => {
                                const raw = e.target.value.trim();
                                const normalized = normalizeStaffId(raw);
                                if (!normalized || normalized === s.id) {
                                  e.target.value = s.id;
                                  return;
                                }
                                changeStaffId(s.id, normalized);
                              }}
                            />
                          </td>

                          <td className="border border-emerald-200 p-2">
                            <input
                              className="w-full h-9 border border-emerald-300 rounded px-2"
                              defaultValue={s.name}
                              onBlur={(e) => {
                                const name = e.target.value.trim();
                                if (!name) {
                                  e.target.value = s.name;
                                  return;
                                }
                                if (name !== s.name) renameStaff(s.id, name);
                              }}
                            />
                          </td>

                          <td className="border border-emerald-200 p-2 text-center">
                            <label className={`inline-flex items-center gap-2 px-2 py-1 rounded border ${s.isSupport ? 'bg-gray-100 text-gray-500 border-gray-300' : 'bg-white border-emerald-300 text-emerald-800'}`}>
                              <input type="checkbox" checked={!!s.preferExtra} disabled={s.isSupport} onChange={() => togglePreferExtra(s.id)} />
                              <span className="text-xs">啟用</span>
                            </label>
                          </td>

                          <td className="border border-emerald-200 p-2 text-center">
                            <label className={`inline-flex items-center gap-2 px-2 py-1 rounded border ${s.isSupport ? 'bg-gray-100 text-gray-500 border-gray-300' : 'bg-white border-emerald-300 text-emerald-800'}`}>
                              <input type="checkbox" checked={!!s.allowG} disabled={s.isSupport} onChange={() => toggleAllowG(s.id)} />
                              <span className="text-xs">啟用</span>
                            </label>
                          </td>

                          <td className="border border-emerald-200 p-2 text-center">
                            {s.isSupport
                              ? <span className="text-xs px-2 py-1 rounded bg-blue-100 text-blue-700">支援</span>
                              : <span className="text-xs text-emerald-700">一般</span>
                            }
                          </td>

                          <td className="border border-emerald-200 p-2 text-center">
                            <button className="h-9 px-3 rounded w-full bg-red-100 text-red-700 hover:bg-red-200" onClick={() => removeStaff(s.id)}>
                              刪除
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'shift' && (
            <div className="p-4 overflow-auto">
              <div className="bg-white rounded border border-emerald-200 p-4 max-w-7xl">
                <h2 className="text-lg font-bold mb-3 flex items-center gap-2 text-emerald-800">
                  <Icons.Settings className="w-5 h-5" />
                  班別管理
                </h2>

                <div className="grid grid-cols-1 md:grid-cols-6 gap-2 mb-4">
                  <input className="border border-emerald-300 rounded px-3 py-2" placeholder="班別代碼(如 X)" value={newShiftCode} onChange={(e) => setNewShiftCode(e.target.value)} />
                  <input className="border border-emerald-300 rounded px-3 py-2 md:col-span-2" placeholder="班別名稱" value={newShiftLabel} onChange={(e) => setNewShiftLabel(e.target.value)} />
                  <input className="border border-emerald-300 rounded px-3 py-2" placeholder="時段" value={newShiftTime} onChange={(e) => setNewShiftTime(e.target.value)} />
                  <input className="border border-emerald-300 rounded px-3 py-2" placeholder="加班時數" value={newShiftOt} onChange={(e) => setNewShiftOt(e.target.value)} />
                  <select className="border border-emerald-300 rounded px-3 py-2" value={newShiftColorKey} onChange={(e) => setNewShiftColorKey(e.target.value)}>
                    {SHIFT_COLOR_OPTIONS.map(c => <option key={c.key} value={c.key}>{c.key}</option>)}
                  </select>
                </div>

                <div className="mb-4">
                  <button onClick={addShift} className="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700">新增班別</button>
                </div>

                <div className="text-xs text-emerald-700 mb-3">
                  每種班別固定 1 列顯示，可拖曳排序、編輯內容、刪除。系統班別（B/G/N/國/OFF/OFF*）不可刪除或改代碼。
                </div>

                <div className="overflow-auto border border-emerald-200 rounded" style={{ maxHeight: '70vh' }}>
                  <table className="min-w-max w-full border-collapse">
                    <thead className="bg-emerald-50">
                      <tr>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-14">拖曳</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-24">代碼</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center">名稱</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-44">時段</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-28">加班時數</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-28">色彩</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-24">預覽</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-24">狀態</th>
                        <th className="sticky top-0 z-20 bg-emerald-50 border border-emerald-200 p-2 text-center w-24">操作</th>
                      </tr>
                    </thead>
                    <tbody>
                      {shiftList.map(s => {
                        const color = SHIFT_COLOR_OPTIONS.find(c => c.key === s.colorKey) || SHIFT_COLOR_OPTIONS[0];
                        return (
                          <tr
                            key={s.code}
                            draggable
                            onDragStart={() => setDragShiftCode(s.code)}
                            onDragOver={(e) => e.preventDefault()}
                            onDrop={() => {
                              reorderShift(dragShiftCode, s.code);
                              setDragShiftCode(null);
                            }}
                            onDragEnd={() => setDragShiftCode(null)}
                            className={`${dragShiftCode === s.code ? 'opacity-70' : ''} bg-white hover:bg-emerald-50`}
                          >
                            <td className="border border-emerald-200 p-2 text-center cursor-move select-none">↕</td>

                            <td className="border border-emerald-200 p-2">
                              <input
                                className={`w-full h-9 border border-emerald-300 rounded px-2 font-mono text-center ${s.locked ? 'bg-gray-100 text-gray-500' : ''}`}
                                defaultValue={s.code}
                                disabled={s.locked}
                                onBlur={(e) => {
                                  const v = e.target.value.trim();
                                  if (!v || v === s.code) {
                                    e.target.value = s.code;
                                    return;
                                  }
                                  changeShiftCode(s.code, v);
                                }}
                              />
                            </td>

                            <td className="border border-emerald-200 p-2">
                              <input
                                className="w-full h-9 border border-emerald-300 rounded px-2"
                                defaultValue={s.label}
                                onBlur={(e) => {
                                  const v = e.target.value.trim();
                                  if (!v || v === s.label) {
                                    e.target.value = s.label;
                                    return;
                                  }
                                  updateShiftField(s.code, { label: v });
                                }}
                              />
                            </td>

                            <td className="border border-emerald-200 p-2">
                              <input
                                className="w-full h-9 border border-emerald-300 rounded px-2"
                                defaultValue={s.time}
                                onBlur={(e) => {
                                  const v = e.target.value.trim() || '-';
                                  if (v === s.time) return;
                                  updateShiftField(s.code, { time: v });
                                }}
                              />
                            </td>

                            <td className="border border-emerald-200 p-2">
                              <input
                                className="w-full h-9 border border-emerald-300 rounded px-2 text-center"
                                defaultValue={String(s.overtime)}
                                onBlur={(e) => {
                                  const n = Number(e.target.value);
                                  if (Number.isNaN(n)) {
                                    e.target.value = String(s.overtime);
                                    showNotification('加班時數需為數字', 'error');
                                    return;
                                  }
                                  if (n !== s.overtime) updateShiftField(s.code, { overtime: n });
                                }}
                              />
                            </td>

                            <td className="border border-emerald-200 p-2">
                              <select
                                className="w-full h-9 border border-emerald-300 rounded px-2"
                                value={s.colorKey}
                                onChange={(e) => updateShiftField(s.code, { colorKey: e.target.value })}
                              >
                                {SHIFT_COLOR_OPTIONS.map(c => <option key={c.key} value={c.key}>{c.key}</option>)}
                              </select>
                            </td>

                            <td className="border border-emerald-200 p-2 text-center">
                              <span className={`inline-block px-2 py-1 rounded text-xs border ${color.className}`}>
                                {s.code}
                              </span>
                            </td>

                            <td className="border border-emerald-200 p-2 text-center">
                              {s.locked ? <span className="text-xs px-2 py-1 rounded bg-gray-200 text-gray-700">系統</span> : <span className="text-xs text-emerald-700">自訂</span>}
                            </td>

                            <td className="border border-emerald-200 p-2 text-center">
                              <button
                                className={`h-9 px-3 rounded w-full ${s.locked ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-red-100 text-red-700 hover:bg-red-200'}`}
                                disabled={s.locked}
                                onClick={() => deleteShift(s.code)}
                              >
                                刪除
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'schedule' && (
            <>
              <div className="bg-white border-b border-emerald-200 px-2 py-1">
                <div ref={topScrollRef} onScroll={onTopScroll} className="overflow-x-auto overflow-y-hidden h-4">
                  <div style={{ width: tableWidth, height: '1px' }}></div>
                </div>
              </div>

              <div ref={mainScrollRef} onScroll={onMainScroll} className="flex-1 overflow-auto relative">
                {renderScheduleTable()}
              </div>

              <div className="bg-white border-t border-emerald-200 p-2 text-xs text-emerald-700 flex justify-between">
                <div>
                  規則: 平日需 2N, 2G (B班不限)。N班加班4h, G班加班0.5h, A班加班0.5h, C班加班4h。<br/>
                  <span className="text-red-500 font-bold">紅色邊框代表連續工作7天（包含值班）。</span>
                </div>
                <div>統計格式: 個人班別統計顯示 N/G/A/國/OFF/OFF*</div>
              </div>
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
